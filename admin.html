<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>Ferrn — Proposal Archive</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="noise">
  <div class="cursor-glow" id="cursorGlow"></div>
  <nav class="app-nav">
    <div class="shell">
      <div class="app-nav-left">
        <a class="logo-link" href="admin.html"><img src="assets/ferrn-logo.jpg" alt="Ferrn logo"><span>FERRN</span></a>
        <div class="nav-divider"></div><span class="nav-label">Proposal archive</span>
      </div>
    </div>
  </nav>

  <main class="admin-main shell">
    <div class="admin-head">
      <div>
        <div class="kicker eyebrow">Admin workspace</div>
        <h1>Your <span class="orange">proposals.</span></h1>
        <p style="margin-top:12px;color:#888;max-width:620px;line-height:1.65">Open any proposal directly. No password or login is required on this admin page.</p>
      </div>
    </div>

    <div class="admin-grid" style="grid-template-columns:1fr">
      <section class="admin-panel">
        <div class="panel-head">
          <div><div class="panel-title">Proposal entries</div><div class="panel-sub" id="entryCount">Loading…</div></div>
          <button class="small-btn" id="refreshBtn">Refresh</button>
        </div>
        <div class="admin-list" id="adminList"></div>
      </section>
    </div>
  </main>

  <script src="js/shared.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
